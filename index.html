<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Three.js Minimal FPS Test</title>
    <!-- ✅ Import Map を定義 -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
          "three/examples/jsm/controls/PointerLockControls.js": "https://unpkg.com/three@0.157.0/examples/jsm/controls/PointerLockControls.js"
        }
      }
    </script>
  </head>
  <body>
    <button id="followEarthBtn">🌍 地球を追う</button>
    <button id="resetCameraBtn">🔄 元に戻す</button>

    <style>
      button {
        position: absolute;
        top: 12px;
        left: 12px;
        margin-right: 8px;
        z-index: 100;
        padding: 6px 12px;
        font-size: 14px;
      }
      #resetCameraBtn {
        left: 120px;
      }
    </style>
    <!-- ✅ main.js を読み込む（キャッシュバスター付き） -->
    <script type="module" src="./main.js?v=plc1"></script>
  </body>
</html>
